name: Flutter CI

on:
  push:
    paths:
      - "lib/**"
      - "test/**"
      - "integration_test/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - "android/**"
      - "ios/**"
      - "web/**"
      - "linux/**"
      - "windows/**"
      - "macos/**"
      - ".github/workflows/flutter-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "lib/**"
      - "test/**"
      - "integration_test/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - "android/**"
      - "ios/**"
      - "web/**"
      - "linux/**"
      - "windows/**"
      - "macos/**"
      - ".github/workflows/flutter-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        # actions/checkout v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Flutter
        # subosito/flutter-action v2.23.0
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true

      - name: Print toolchain versions
        run: |
          flutter --version
          dart --version

      - name: Restore locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify lockfile did not drift
        run: git diff --exit-code -- pubspec.lock

      - name: Analyze Flutter source
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test --reporter expanded

      - name: Verify repository did not drift
        run: git diff --exit-code
